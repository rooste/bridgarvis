spring:
  application:
    name: bridgarvis
  jackson:
    serialization:
      write-dates-as-timestamps: false
  ssl:
    bundle:
      pem:
        # Server identity + the pinned client certificate. Only a client presenting
        # exactly this certificate (Juujarvis) can complete the TLS handshake.
        bridgarvis:
          reload-on-update: ${BRIDGARVIS_TLS_RELOAD:false}
          keystore:
            certificate: ${BRIDGARVIS_TLS_CERT:file:certs/server.pem}
            private-key: ${BRIDGARVIS_TLS_KEY:file:certs/server.key}
          truststore:
            certificate: ${BRIDGARVIS_CLIENT_CERT:file:certs/juujarvis.pem}

server:
  port: ${BRIDGARVIS_PORT:8443}
  ssl:
    bundle: bridgarvis
    client-auth: need

# Health checks run on localhost only, without TLS, so deploy scripts don't need the client cert.
management:
  server:
    port: ${BRIDGARVIS_MANAGEMENT_PORT:8081}
    address: 127.0.0.1
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

bridgarvis:
  # memory (local/tests) or dynamo (AWS: DynamoDB table + S3 mail bucket)
  store: ${BRIDGARVIS_STORE:memory}
  messages-table: ${BRIDGARVIS_MESSAGES_TABLE:}
  sms:
    number: ${BRIDGARVIS_SMS_NUMBER:+15550000000}
  mail:
    ingest-enabled: ${BRIDGARVIS_MAIL_INGEST:false}
    bucket: ${BRIDGARVIS_MAIL_BUCKET:}
    queue-url: ${BRIDGARVIS_MAIL_QUEUE_URL:}
    # Mail to these addresses (comma-separated, case-insensitive) goes to the assistant if it passes the auth checks
    juujarvis-address: ${BRIDGARVIS_JUUJARVIS_ADDRESS:}
    # Mailboxes Juujarvis only notifies about (comma-separated, case-insensitive), e.g. info@
    notify-addresses: ${BRIDGARVIS_NOTIFY_ADDRESSES:}
    # School mailbox (comma-separated) and the senders whose authenticated mail is processed:
    # domains (incl. subdomains) or exact addresses, e.g. a parent who forwards school mail by hand
    school-addresses: ${BRIDGARVIS_SCHOOL_ADDRESSES:}
    school-sender-domains: ${BRIDGARVIS_SCHOOL_SENDER_DOMAINS:}
    retention-days: 365
    # Sending (SES): the only From address, the configuration set, and its delivery-events queue
    from-address: ${BRIDGARVIS_MAIL_FROM_ADDRESS:assistant@example.com}
    configuration-set: ${BRIDGARVIS_MAIL_CONFIGURATION_SET:}
    events-queue-url: ${BRIDGARVIS_MAIL_EVENTS_QUEUE_URL:}
  alexa:
    # Alexa custom skill: only its requests are accepted. Empty = every /alexa request is rejected.
    skill-id: ${BRIDGARVIS_ALEXA_SKILL_ID:}
    # Localhost plain-HTTP connector that nginx forwards /alexa to (0 = off)
    port: ${BRIDGARVIS_ALEXA_PORT:0}
    # Amazon Polly voice for the skill's speech (e.g. Brian, Matthew); empty = Alexa's own voice
    voice: ${BRIDGARVIS_ALEXA_VOICE:}
